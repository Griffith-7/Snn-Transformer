[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrohebbian"
version = "0.1.0"
description = "Standalone Astrocyte-Hebbian spiking linear Transformer components"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sumith" }]
keywords = ["spiking-neural-networks", "transformer", "attention", "hebbian", "snns", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.0"]

[project.urls]
Homepage = "https://github.com/yourname/astrohebbian"
Source = "https://github.com/yourname/astrohebbian"
"Issue Tracker" = "https://github.com/yourname/astrohebbian/issues"

[project.optional-dependencies]
test = ["pytest>=7"]
benchmark = ["torchvision>=0.15", "matplotlib>=3.7"]
quality = ["ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["astrohebbian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
